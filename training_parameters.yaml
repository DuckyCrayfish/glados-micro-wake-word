batch_size: 512
clip_duration_ms: 1500
eval_step_interval: 250
features:
- features_dir: data/generated_augmented_features
  penalty_weight: 1.0
  sampling_weight: 3.0
  truncation_strategy: truncate_start
  truth: true
  type: mmap
- features_dir: data/negative_datasets/speech
  penalty_weight: 1.0
  sampling_weight: 10.0
  truncation_strategy: random
  truth: false
  type: mmap
- features_dir: data/negative_datasets/dinner_party
  penalty_weight: 1.0
  sampling_weight: 10.0
  truncation_strategy: random
  truth: false
  type: mmap
- features_dir: data/negative_datasets/no_speech
  penalty_weight: 1.0
  sampling_weight: 5.0
  truncation_strategy: random
  truth: false
  type: mmap
- features_dir: data/near_miss_features
  penalty_weight: 1.5
  sampling_weight: 1.0
  truncation_strategy: truncate_start
  truth: false
  type: mmap
- features_dir: data/negative_datasets/dinner_party_eval
  penalty_weight: 1.0
  sampling_weight: 0.0
  truncation_strategy: split
  truth: false
  type: mmap
freq_mask_count:
- 2
freq_mask_max_size:
- 3
learning_rates:
- 0.01
- 0.001
- 0.0001
- 1.0e-05
maximization_metric: average_viable_recall
minimization_metric: null
negative_class_weight:
- 2
positive_class_weight:
- 1
target_minimization: 0.9
time_mask_count:
- 2
time_mask_max_size:
- 5
train_dir: output/05-fast-loader
training_steps:
- 30000
- 20000
- 10000
- 10000
window_step_ms: 10
